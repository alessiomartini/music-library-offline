[project]
name = "music-library-offline"
version = "0.1.0"
description = "Offline audio-to-score pipeline for music-library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "demucs>=4.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "music21>=9.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "pretty-midi>=0.2.10",
    "basic-pitch>=0.4.0",
    "lv-chordia>=1.1.0",
    "uroman>=1.3.0",
    # pydub (an lv-chordia dependency) still imports stdlib `audioop`, which
    # Python 3.13+ removed (PEP 594); this backport keeps it importable.
    "audioop-lts>=0.2.0; python_version >= '3.13'",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]